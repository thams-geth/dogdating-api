openapi: 3.1.0
info:
  title: Waggle Express API
  version: 0.1.0
  description: Implemented routes only. Planned endpoints are in API_PLAN.md.
servers:
  - url: http://localhost:3000
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /v1/ready:
    get:
      operationId: readiness
      responses:
        '200': { description: Database and required schema are ready }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/app/countries:
    get:
      operationId: countries
      responses:
        '200':
          description: Markets with rollout and locale settings; development is not a public launch
          content:
            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries:
                    type: array
                    items: { $ref: '#/components/schemas/Country' }
  /v1/app/bootstrap:
    get:
      operationId: bootstrap
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [android, ios] } }
        - { name: buildNumber, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 9999999999 } }
        - { name: countryCode, in: query, schema: { type: string, pattern: '^[A-Z]{2}$', default: IN } }
        - { name: locale, in: query, schema: { type: string, minLength: 2, maxLength: 35, default: en-IN } }
      responses:
        '200':
          description: Effective country, update policy and feature availability
          content:
            application/json:
              schema:
                type: object
                required: [policyRevision, maintenance, country, effectiveLocale, update, features, legal]
                properties:
                  policyRevision: { type: string }
                  maintenance: { type: boolean }
                  country:
                    oneOf:
                      - { $ref: '#/components/schemas/Country' }
                      - type: object
                        required: [countryCode, rollout]
                        properties:
                          countryCode: { type: string }
                          rollout: { const: unavailable }
                  effectiveLocale: { type: string }
                  update:
                    type: object
                    required: [action, minimumBuild, latestBuild, storeUrl]
                    properties:
                      action: { enum: [none, recommended, required] }
                      minimumBuild: { type: integer }
                      latestBuild: { type: integer }
                      storeUrl: { type: [string, 'null'], format: uri }
                  features:
                    type: object
                    properties:
                      pack: { type: boolean }
                      lineage: { type: boolean }
                      spark: { type: boolean }
                      billing: { type: boolean }
                  legal:
                    type: object
                    description: Null until reviewed documents are published
                    properties:
                      termsVersion: { type: [string, 'null'] }
                      privacyVersion: { type: [string, 'null'] }
                      communityVersion: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/dogs/breeds:
    get:
      operationId: breeds
      responses:
        '200':
          description: Public breed reference catalogue
          content:
            application/json:
              schema:
                type: object
                required: [breeds]
                properties:
                  breeds:
                    type: array
                    items:
                      type: object
                      required: [id, name, sizeClass, typicalEnergy, requiredHealthTests, conformationFlags]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        sizeClass: { type: string }
                        typicalEnergy: { type: [integer, 'null'] }
                        requiredHealthTests: { type: array, items: { type: string } }
                        conformationFlags: { type: array, items: { type: string } }
components:
  responses:
    Problem:
      description: Structured API error; status/code/detail depend on the failure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, code, title, status, detail, requestId]
      properties:
        type: { type: string }
        code: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              code: { type: string }
    Country:
      type: object
      required: [countryCode, name, rollout, callingCode, currency, distanceUnit, defaultLocale, supportedLocales, defaultTimezone, minimumAge]
      properties:
        countryCode: { type: string }
        name: { type: string }
        rollout: { type: string, enum: [development] }
        callingCode: { type: string }
        currency: { type: string }
        distanceUnit: { type: string }
        defaultLocale: { type: string }
        supportedLocales: { type: array, items: { type: string } }
        defaultTimezone: { type: string }
        minimumAge: { type: integer }
