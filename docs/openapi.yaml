openapi: 3.1.0
info:
  title: Waggle Express API
  version: 0.1.0
  description: Implemented routes only. Planned endpoints are in API_PLAN.md.
servers:
  - url: http://localhost:3000
paths:
  /webhooks/verification:
    post:
      operationId: receiveVerificationProviderEvent
      summary: Process a verified provider event with replay protection
      description: >-
        Provider-only callback. The raw JSON body, authentication headers and
        timestamp format depend on the selected provider adapter. No adapter
        is installed by default, so the route returns 503. Mobile and web
        clients must never call this route. The adapter must authenticate the
        exact raw bytes before normalizing an event. Test fixtures are not a
        production provider contract.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload; no production vendor selected.
              additionalProperties: true
      responses:
        "200":
          description: Authenticated event accepted, or exact replay acknowledged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, requestId, duplicate]
                properties:
                  accepted:
                    const: true
                  requestId:
                    type: string
                    format: uuid
                  duplicate:
                    type: boolean
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
  /v1/ready:
    get:
      operationId: readiness
      responses:
        "200":
          description: Database and required schema are ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    const: ready
                required:
                  - status
        "503":
          $ref: "#/components/responses/Problem"
  /v1/app/countries:
    get:
      operationId: countries
      responses:
        "200":
          description: Markets with rollout and locale settings; development is not a
            public launch
          content:
            application/json:
              schema:
                type: object
                required:
                  - countries
                properties:
                  countries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"
  /v1/app/bootstrap:
    get:
      operationId: bootstrap
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
        - name: buildNumber
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999999999
        - name: countryCode
          in: query
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            default: IN
        - name: locale
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 35
            default: en-IN
      responses:
        "200":
          description: Effective country, update policy and feature availability
          content:
            application/json:
              schema:
                type: object
                required:
                  - policyRevision
                  - maintenance
                  - country
                  - effectiveLocale
                  - update
                  - features
                  - legal
                properties:
                  policyRevision:
                    type: string
                  maintenance:
                    type: boolean
                  country:
                    oneOf:
                      - $ref: "#/components/schemas/Country"
                      - type: object
                        required:
                          - countryCode
                          - rollout
                        properties:
                          countryCode:
                            type: string
                          rollout:
                            const: unavailable
                  effectiveLocale:
                    type: string
                  update:
                    type: object
                    required:
                      - action
                      - minimumBuild
                      - latestBuild
                      - storeUrl
                    properties:
                      action:
                        enum:
                          - none
                          - recommended
                          - required
                      minimumBuild:
                        type: integer
                      latestBuild:
                        type: integer
                      storeUrl:
                        type:
                          - string
                          - "null"
                        format: uri
                  features:
                    type: object
                    properties:
                      pack:
                        type: boolean
                      lineage:
                        type: boolean
                      spark:
                        type: boolean
                      billing:
                        type: boolean
                  legal:
                    type: object
                    description: Null until reviewed documents are published
                    properties:
                      termsVersion:
                        type:
                          - string
                          - "null"
                      privacyVersion:
                        type:
                          - string
                          - "null"
                      communityVersion:
                        type:
                          - string
                          - "null"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/dogs/breeds:
    get:
      operationId: breeds
      responses:
        "200":
          description: Public breed reference catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                  - breeds
                properties:
                  breeds:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - sizeClass
                        - typicalEnergy
                        - requiredHealthTests
                        - conformationFlags
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        sizeClass:
                          type: string
                        typicalEnergy:
                          type:
                            - integer
                            - "null"
                        requiredHealthTests:
                          type: array
                          items:
                            type: string
                        conformationFlags:
                          type: array
                          items:
                            type: string
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      description: Generic acceptance; per-phone cooldown/limit suppression and
        provider failure have the same response. Development sender only. Any valid supported phone uses code 000000 in the explicitly enabled
        development sender after a fresh request; all normal expiry and attempt rules still apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtp"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    const: accepted
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      description: Verify once; displayName required only for new accounts. New
        accounts remain pending onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/refresh:
    post:
      operationId: refresh
      description: Rotate refresh token; reuse revokes the family. Clients must
        serialize refresh requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revoke current session family.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      description: Revoke all current user sessions.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions:
    get:
      operationId: sessions
      description: List active device sessions belonging to current user, maximum 100.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      description: Revoke one of the current user's session families. Inaccessible
        sessions return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: me
      description: Private guardian profile; phone masked.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
    patch:
      operationId: updateMe
      description: Allowlisted name, locale and timezone edits. No verification, role
        or status edits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/legal/documents/{kind}:
    get:
      operationId: legalDocument
      description: Read current or historical published text. Draft, missing and
        future documents return 404. No legal text seeded.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            enum:
              - terms
              - privacy
              - community
              - location
              - marketing
        - name: countryCode
          in: query
          schema:
            const: IN
            default: IN
        - name: locale
          in: query
          schema:
            const: en-IN
            default: en-IN
        - name: version
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding:
    get:
      operationId: onboarding
      description: Live prerequisites; prior completion does not override missing or
        expired evidence.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/me/onboarding/preferences:
    put:
      operationId: saveOnboardingPreferences
      description: Persist self-declaration and preferences; never awards verification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPreferences"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/me/onboarding/complete:
    post:
      operationId: completeOnboarding
      description: 409 if any server-evaluated prerequisite is missing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/me/consents:
    get:
      operationId: consents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
    post:
      operationId: acceptConsent
      description: Accept current published document once. Repeated acceptance does
        not duplicate evidence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/me/consents/{purpose}:
    delete:
      operationId: withdrawConsent
      description: Append withdrawal; required/location withdrawal pauses discovery.
        Repeating is harmless.
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            enum:
              - terms
              - privacy
              - community
              - location
              - marketing
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
      responses:
        "204":
          description: Success
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/active-dog:
    put:
      operationId: selectActiveDog
      description: Select an active household dog or clear with null. Checks accepted
        membership.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveDogInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/me/preferences:
    get:
      operationId: userPreferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
    patch:
      operationId: saveUserPreferences
      description: Enabling discovery requires current complete onboarding.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
  /v1/households:
    post:
      operationId: createHousehold
      description: Creates household and accepted owner atomically. Maximum ten
        households per user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
      parameters:
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
    get:
      operationId: listHouseholds
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 400
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Households"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
  /v1/households/{id}:
    get:
      operationId: getHousehold
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: renameHousehold
      description: Owner or co-guardian only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-App-Platform
          in: header
          required: false
          description: Required when either platform minimum build exceeds 1.
          schema:
            type: string
            enum:
              - android
              - ios
        - name: X-App-Build
          in: header
          required: false
          description: Positive integer app build; required with platform once a forced
            update is active.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,9}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        default:
          $ref: "#/components/responses/Problem"
  /v1/households/{id}/members:
    get:
      operationId: listMembers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-App-Platform
          in: header
