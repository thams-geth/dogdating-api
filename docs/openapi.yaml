openapi: 3.1.0
info:
  title: Waggle Express API
  version: 0.1.0
  description: Implemented routes only. Planned endpoints are in API_PLAN.md.
servers:
  - url: http://localhost:3000
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
  /v1/ready:
    get:
      operationId: readiness
      responses:
        "200":
          description: Database and required schema are ready
        "503":
          $ref: "#/components/responses/Problem"
  /v1/app/countries:
    get:
      operationId: countries
      responses:
        "200":
          description: Markets with rollout and locale settings; development is not a
            public launch
          content:
            application/json:
              schema:
                type: object
                required:
                  - countries
                properties:
                  countries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"
  /v1/app/bootstrap:
    get:
      operationId: bootstrap
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
        - name: buildNumber
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999999999
        - name: countryCode
          in: query
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            default: IN
        - name: locale
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 35
            default: en-IN
      responses:
        "200":
          description: Effective country, update policy and feature availability
          content:
            application/json:
              schema:
                type: object
                required:
                  - policyRevision
                  - maintenance
                  - country
                  - effectiveLocale
                  - update
                  - features
                  - legal
                properties:
                  policyRevision:
                    type: string
                  maintenance:
                    type: boolean
                  country:
                    oneOf:
                      - $ref: "#/components/schemas/Country"
                      - type: object
                        required:
                          - countryCode
                          - rollout
                        properties:
                          countryCode:
                            type: string
                          rollout:
                            const: unavailable
                  effectiveLocale:
                    type: string
                  update:
                    type: object
                    required:
                      - action
                      - minimumBuild
                      - latestBuild
                      - storeUrl
                    properties:
                      action:
                        enum:
                          - none
                          - recommended
                          - required
                      minimumBuild:
                        type: integer
                      latestBuild:
                        type: integer
                      storeUrl:
                        type:
                          - string
                          - "null"
                        format: uri
                  features:
                    type: object
                    properties:
                      pack:
                        type: boolean
                      lineage:
                        type: boolean
                      spark:
                        type: boolean
                      billing:
                        type: boolean
                  legal:
                    type: object
                    description: Null until reviewed documents are published
                    properties:
                      termsVersion:
                        type:
                          - string
                          - "null"
                      privacyVersion:
                        type:
                          - string
                          - "null"
                      communityVersion:
                        type:
                          - string
                          - "null"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/dogs/breeds:
    get:
      operationId: breeds
      responses:
        "200":
          description: Public breed reference catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                  - breeds
                properties:
                  breeds:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - sizeClass
                        - typicalEnergy
                        - requiredHealthTests
                        - conformationFlags
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        sizeClass:
                          type: string
                        typicalEnergy:
                          type:
                            - integer
                            - "null"
                        requiredHealthTests:
                          type: array
                          items:
                            type: string
                        conformationFlags:
                          type: array
                          items:
                            type: string
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      description: Generic acceptance; per-phone cooldown/limit suppression and
        provider failure have the same response. Development sender only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtp"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    const: accepted
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      description: Verify once; displayName required only for new accounts. New
        accounts remain pending onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/refresh:
    post:
      operationId: refresh
      description: Rotate refresh token; reuse revokes the family. Clients must
        serialize refresh requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revoke current session family.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      description: Revoke all current user sessions.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions:
    get:
      operationId: sessions
      description: List active device sessions belonging to current user, maximum 100.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      description: Revoke one of the current user's session families. Inaccessible
        sessions return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: &a2
            type: string
            format: uuid
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: me
      description: Private guardian profile; phone masked.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      description: Allowlisted name, locale and timezone edits. No verification, role
        or status edits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/legal/documents/{kind}:
    get:
      operationId: legalDocument
      description: Read current or historical published text. Draft, missing and
        future documents return 404. No legal text seeded.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            enum: &a1
              - terms
              - privacy
              - community
              - location
              - marketing
        - name: countryCode
          in: query
          schema:
            const: IN
            default: IN
        - name: locale
          in: query
          schema:
            const: en-IN
            default: en-IN
        - name: version
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding:
    get:
      operationId: onboarding
      description: Live prerequisites; prior completion does not override missing or
        expired evidence.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/preferences:
    put:
      operationId: saveOnboardingPreferences
      description: Persist self-declaration and preferences; never awards verification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPreferences"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/complete:
    post:
      operationId: completeOnboarding
      description: 409 if any server-evaluated prerequisite is missing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/consents:
    get:
      operationId: consents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: acceptConsent
      description: Accept current published document once. Repeated acceptance does
        not duplicate evidence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/consents/{purpose}:
    delete:
      operationId: withdrawConsent
      description: Append withdrawal; required/location withdrawal pauses discovery.
        Repeating is harmless.
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            enum: *a1
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/active-dog:
    put:
      operationId: selectActiveDog
      description: Select an active household dog or clear with null. Checks accepted
        membership.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveDogInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/preferences:
    get:
      operationId: userPreferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: saveUserPreferences
      description: Enabling discovery requires current complete onboarding.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Structured API error; status/code/detail depend on the failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required:
        - type
        - code
        - title
        - status
        - detail
        - requestId
      properties:
        type:
          type: string
        code:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
    Country:
      type: object
      required:
        - countryCode
        - name
        - rollout
        - callingCode
        - currency
        - distanceUnit
        - defaultLocale
        - supportedLocales
        - defaultTimezone
        - minimumAge
      properties:
        countryCode:
          type: string
        name:
          type: string
        rollout:
          type: string
          enum:
            - development
        callingCode:
          type: string
        currency:
          type: string
        distanceUnit:
          type: string
        defaultLocale:
          type: string
        supportedLocales:
          type: array
          items:
            type: string
        defaultTimezone:
          type: string
        minimumAge:
          type: integer
    RequestOtp:
      type: object
      additionalProperties: false
      required:
        - phoneE164
      properties:
        phoneE164:
          type: string
          pattern: ^\+91[6-9]\d{9}$
        countryCode:
          const: IN
          default: IN
    VerifyOtp:
      type: object
      additionalProperties: false
      required:
        - phoneE164
        - code
        - deviceId
      properties:
        phoneE164:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
        code:
          type: string
          pattern: ^\d{6}$
        deviceId: *a2
        displayName:
          type: string
          minLength: 1
          maxLength: 50
    Refresh:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 80
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - userId
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          const: 900
        userId: *a2
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: []
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        locale:
          enum:
            - en-IN
        timezone:
          type: string
          maxLength: 64
      minProperties: 1
    Me:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - phoneE164Masked
        - locale
        - timezone
        - status
        - countryCode
        - residencyRegion
        - createdAt
      properties:
        id: *a2
        displayName:
          type: string
        phoneE164Masked:
          type: string
        locale:
          type: string
        timezone:
          type: string
        status:
          type: string
        countryCode:
          type: string
        residencyRegion:
          type: string
        createdAt:
          type: string
          format: date-time
    Sessions:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - deviceId
              - createdAt
              - expiresAt
              - current
            properties:
              id: *a2
              deviceId: *a2
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              current:
                type: boolean
    OnboardingPreferences:
      type: object
      additionalProperties: false
      required:
        - countryCode
        - locale
        - mode
        - adultDeclared
      properties:
        countryCode:
          const: IN
        locale:
          const: en-IN
        mode:
          const: pack
        adultDeclared: &a3
          type: boolean
    ConsentInput:
      type: object
      additionalProperties: false
      required:
        - documentId
      properties:
        documentId: &a5
          type: string
          format: uuid
    ActiveDogInput:
      type: object
      additionalProperties: false
      required:
        - dogId
      properties:
        dogId:
          type:
            - string
            - "null"
          format: uuid
    UserPreferences:
      type: object
      additionalProperties: false
      required:
        - discoveryPaused
        - readReceipts
      properties:
        discoveryPaused: *a3
        readReceipts: *a3
    UserPreferencesPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        discoveryPaused: *a3
        readReceipts: *a3
      minProperties: 1
    Onboarding:
      type: object
      additionalProperties: false
      required:
        - rulesVersion
        - ready
        - missing
        - nextAction
        - activeDogId
        - completedAt
        - preferences
      properties:
        rulesVersion:
          const: 1
        ready: *a3
        missing:
          type: array
          items: &a6
            type: string
        nextAction: &a4
          type:
            - string
            - "null"
        activeDogId:
          type:
            - string
            - "null"
          format: uuid
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        preferences:
          $ref: "#/components/schemas/OnboardingPreferences"
    ConsentState:
      type: object
      additionalProperties: false
      required:
        - consents
      properties:
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - purpose
              - required
              - currentDocumentId
              - currentVersion
              - status
              - acceptedDocumentId
              - current
              - recordedAt
            properties:
              purpose:
                enum: *a1
              required: *a3
              currentDocumentId: *a4
              currentVersion: *a4
              status:
                enum:
                  - accepted
                  - withdrawn
                  - not-accepted
              acceptedDocumentId: *a4
              current: *a3
              recordedAt:
                type:
                  - string
                  - "null"
                format: date-time
    LegalDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - version
        - countryCode
        - locale
        - body
        - contentSha256
        - publishedAt
      properties:
        id: *a5
        purpose:
          enum: *a1
        version: *a6
        countryCode: *a6
        locale: *a6
        body: *a6
        contentSha256: *a6
        publishedAt:
          type: string
          format: date-time
    EmptyBody:
      type: object
      additionalProperties: false
      required: []
      properties: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
