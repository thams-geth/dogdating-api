components:
  responses:
    Problem:
      description: Structured API error; status/code/detail depend on the failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UpgradeRequired:
      description: A confirmed minimum app build is required. Fetch bootstrap for the
        current store URL.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required:
        - type
        - code
        - title
        - status
        - detail
        - requestId
      properties:
        type:
          type: string
        code:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
    Country:
      type: object
      required:
        - countryCode
        - name
        - rollout
        - callingCode
        - currency
        - distanceUnit
        - defaultLocale
        - supportedLocales
        - defaultTimezone
        - minimumAge
      properties:
        countryCode:
          type: string
        name:
          type: string
        rollout:
          type: string
          enum:
            - development
        callingCode:
          type: string
        currency:
          type: string
        distanceUnit:
          type: string
        defaultLocale:
          type: string
        supportedLocales:
          type: array
          items:
            type: string
        defaultTimezone:
          type: string
        minimumAge:
          type: integer
    RequestOtp:
      type: object
      additionalProperties: false
      required:
        - phoneE164
      properties:
        phoneE164:
          type: string
          pattern: ^\+91[6-9]\d{9}$
        countryCode:
          const: IN
          default: IN
    VerifyOtp:
      type: object
      additionalProperties: false
      required:
        - phoneE164
        - code
        - deviceId
