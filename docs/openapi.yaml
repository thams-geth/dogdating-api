openapi: 3.1.0
info:
  title: Waggle Express API
  version: 0.1.0
  description: Implemented routes only. Planned endpoints are in API_PLAN.md.
servers:
  - url: http://localhost:3000
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
  /v1/ready:
    get:
      operationId: readiness
      responses:
        "200":
          description: Database and required schema are ready
        "503":
          $ref: "#/components/responses/Problem"
  /v1/app/countries:
    get:
      operationId: countries
      responses:
        "200":
          description: Markets with rollout and locale settings; development is not a
            public launch
          content:
            application/json:
              schema:
                type: object
                required:
                  - countries
                properties:
                  countries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"
  /v1/app/bootstrap:
    get:
      operationId: bootstrap
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
        - name: buildNumber
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999999999
        - name: countryCode
          in: query
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            default: IN
        - name: locale
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 35
            default: en-IN
      responses:
        "200":
          description: Effective country, update policy and feature availability
          content:
            application/json:
              schema:
                type: object
                required:
                  - policyRevision
                  - maintenance
                  - country
                  - effectiveLocale
                  - update
                  - features
                  - legal
                properties:
                  policyRevision:
                    type: string
                  maintenance:
                    type: boolean
                  country:
                    oneOf:
                      - $ref: "#/components/schemas/Country"
                      - type: object
                        required:
                          - countryCode
                          - rollout
                        properties:
                          countryCode:
                            type: string
                          rollout:
                            const: unavailable
                  effectiveLocale:
                    type: string
                  update:
                    type: object
                    required:
                      - action
                      - minimumBuild
                      - latestBuild
                      - storeUrl
                    properties:
                      action:
                        enum:
                          - none
                          - recommended
                          - required
                      minimumBuild:
                        type: integer
                      latestBuild:
                        type: integer
                      storeUrl:
                        type:
                          - string
                          - "null"
                        format: uri
                  features:
                    type: object
                    properties:
                      pack:
                        type: boolean
                      lineage:
                        type: boolean
                      spark:
                        type: boolean
                      billing:
                        type: boolean
                  legal:
                    type: object
                    description: Null until reviewed documents are published
                    properties:
                      termsVersion:
                        type:
                          - string
                          - "null"
                      privacyVersion:
                        type:
                          - string
                          - "null"
                      communityVersion:
                        type:
                          - string
                          - "null"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/dogs/breeds:
    get:
      operationId: breeds
      responses:
        "200":
          description: Public breed reference catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                  - breeds
                properties:
                  breeds:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - sizeClass
                        - typicalEnergy
                        - requiredHealthTests
                        - conformationFlags
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        sizeClass:
                          type: string
                        typicalEnergy:
                          type:
                            - integer
                            - "null"
                        requiredHealthTests:
                          type: array
                          items:
                            type: string
                        conformationFlags:
                          type: array
                          items:
                            type: string
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      description: Generic acceptance; per-phone cooldown/limit suppression and
        provider failure have the same response. Development sender only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtp"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    const: accepted
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      description: Verify once; displayName required only for new accounts. New
        accounts remain pending onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/refresh:
    post:
      operationId: refresh
      description: Rotate refresh token; reuse revokes the family. Clients must
        serialize refresh requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revoke current session family.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      description: Revoke all current user sessions.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions:
    get:
      operationId: sessions
      description: List active device sessions belonging to current user, maximum 100.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      description: Revoke one of the current user's session families. Inaccessible
        sessions return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: &a7
            type: string
            format: uuid
      responses:
        "204":
          description: Completed without a response body
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: me
      description: Private guardian profile; phone masked.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      description: Allowlisted name, locale and timezone edits. No verification, role
        or status edits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/legal/documents/{kind}:
    get:
      operationId: legalDocument
      description: Read current or historical published text. Draft, missing and
        future documents return 404. No legal text seeded.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            enum: &a1
              - terms
              - privacy
              - community
              - location
              - marketing
        - name: countryCode
          in: query
          schema:
            const: IN
            default: IN
        - name: locale
          in: query
          schema:
            const: en-IN
            default: en-IN
        - name: version
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding:
    get:
      operationId: onboarding
      description: Live prerequisites; prior completion does not override missing or
        expired evidence.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/preferences:
    put:
      operationId: saveOnboardingPreferences
      description: Persist self-declaration and preferences; never awards verification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPreferences"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/onboarding/complete:
    post:
      operationId: completeOnboarding
      description: 409 if any server-evaluated prerequisite is missing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/consents:
    get:
      operationId: consents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: acceptConsent
      description: Accept current published document once. Repeated acceptance does
        not duplicate evidence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/consents/{purpose}:
    delete:
      operationId: withdrawConsent
      description: Append withdrawal; required/location withdrawal pauses discovery.
        Repeating is harmless.
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            enum: *a1
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/active-dog:
    put:
      operationId: selectActiveDog
      description: Select an active household dog or clear with null. Checks accepted
        membership.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveDogInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/preferences:
    get:
      operationId: userPreferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: saveUserPreferences
      description: Enabling discovery requires current complete onboarding.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        default:
          $ref: "#/components/responses/Problem"
  /v1/households:
    post:
      operationId: createHousehold
      description: Creates household and accepted owner atomically. Maximum ten
        households per user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listHouseholds
      security:
        - bearerAuth: []
      parameters: &a4
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 400
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Households"
        default:
          $ref: "#/components/responses/Problem"
  /v1/households/{id}:
    get:
      operationId: getHousehold
      security:
        - bearerAuth: []
      parameters:
        - &a2
          name: id
          in: path
          required: true
          schema: &a3
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: renameHousehold
      description: Owner or co-guardian only.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Problem"
  /v1/households/{id}/members:
    get:
      operationId: listMembers
      security:
        - bearerAuth: []
      parameters:
        - *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Members"
        default:
          $ref: "#/components/responses/Problem"
  /v1/households/{id}/members/{userId}:
    patch:
      operationId: changeMemberRole
      description: Owner only. Serializes membership changes; cannot remove or demote
        the final accepted owner.
      security:
        - bearerAuth: []
      parameters:
        - *a2
        - name: userId
          in: path
          required: true
          schema: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRole"
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      description: Owner only. Serializes membership changes; cannot remove or demote
        the final accepted owner.
      security:
        - bearerAuth: []
      parameters:
        - *a2
        - name: userId
          in: path
          required: true
          schema: *a3
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Problem"
  /v1/households/{id}/invitations:
    post:
      operationId: inviteMember
      description: Owner only; 20 invites per household/day. Token expires in seven
        days and must be shared manually. No SMS is sent.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Problem"
  /v1/household-invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      description: Bound to the recipient verified phone. Consumed/expired tokens
        return 409. Existing membership cannot be overwritten; inviter must
        still be an owner.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs:
    post:
      operationId: createDog
      description: Owner/co-guardian; draft by default, maximum 20 active dogs per
        household.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDog"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listDogs
      security:
        - bearerAuth: []
      parameters: *a4
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dogs"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}:
    get:
      operationId: getOwnDog
      description: Accepted household members only. This is not a public discovery
        projection.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDog
      description: Owner/co-guardian. Validates merged dates; profile edits reset
        publication and identity changes revoke dog verification grants.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDog"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/breeds:
    put:
      operationId: replaceDogBreeds
      description: Unique breed IDs; percentages sum to 100. Evidence is declared only.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogBreedsInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/temperament:
    put:
      operationId: replaceTemperament
      description: Version 1 self-reported dimensions. Not a medical compatibility
        guarantee.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemperamentInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/preferences:
    put:
      operationId: replaceDogPreferences
      description: PUT replaces all filters using documented defaults. Min/max ranges
        must be ordered; acceptsReactive requires parallelWalkOnly.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DogPreferencesInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/availability:
    put:
      operationId: replaceAvailability
      description: "Weekly local-time windows: Sunday=0, minute offsets, no overlaps
        or overnight windows. Split overnight windows across days; PUT replaces
        schedule and preserves active beacon."
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Availability"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/publish:
    post:
      operationId: publishDog
      description: Requires current onboarding readiness and selection of this active dog.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/pause:
    post:
      operationId: pauseDog
      description: "Owner/co-guardian: hide dog and clear walking beacon."
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/memorialise:
    post:
      operationId: memorialiseDog
      description: Owner only; irreversible through profile editing. Clears beacon and
        removes active-dog eligibility.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{id}/beacon:
    post:
      operationId: startBeacon
      description: Requires publication, current onboarding, active dog and discovery
        enabled. Replaces prior beacon, capped at 90 minutes.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeaconInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beacon"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: stopBeacon
      description: Owner/co-guardian can cancel; weekly availability is retained.
      security:
        - bearerAuth: []
      parameters:
        - *a2
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{dogId}/media/uploads:
    post:
      operationId: createPhotoUpload
      summary: Reserve a private photo upload; local bearer PUT expires after 15 minutes
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: &a5
            type: string
            format: uuid
      responses:
        "201":
          description: Reserve a private photo upload; local bearer PUT expires after 15
            minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadCreated"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
  /v1/dogs/{dogId}/media:
    get:
      operationId: listDogPhotos
      summary: List household photo metadata; no storage keys or image URLs
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: *a5
      responses:
        "200":
          description: List household photo metadata; no storage keys or image URLs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  media:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoStatus"
                required:
                  - media
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{dogId}/media/order:
    patch:
      operationId: orderDogPhotos
      summary: Replace the complete live photo order
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: *a5
      responses:
        "204":
          description: Replace the complete live photo order
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mediaIds:
                  type: array
                  items: *a5
                  minItems: 1
                  maxItems: 30
                  uniqueItems: true
              required:
                - mediaIds
  /v1/dogs/{dogId}/media/{id}:
    delete:
      operationId: deleteDogPhoto
      summary: Delete photo, invalidate publication and schedule physical cleanup
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: *a5
        - name: id
          in: path
          required: true
          schema: *a5
      responses:
        "204":
          description: Delete photo, invalidate publication and schedule physical cleanup
        default:
          $ref: "#/components/responses/Problem"
  /v1/media/{id}/content:
    put:
      operationId: uploadPhotoContent
      summary: Uploader-only single-use JPEG/PNG content, maximum 8 MiB and 20
        megapixels
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a5
      responses:
        "200":
          description: Uploader-only single-use JPEG/PNG content, maximum 8 MiB and 20
            megapixels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoStatus"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
  /v1/media/{id}/complete:
    post:
      operationId: completePhotoUpload
      summary: Idempotently complete an uploaded photo; moderation remains pending
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a5
      responses:
        "200":
          description: Idempotently complete an uploaded photo; moderation remains pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoStatus"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
  /v1/media/{id}:
    get:
      operationId: getPhotoStatus
      summary: Read household-scoped photo processing status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a5
      responses:
        "200":
          description: Read household-scoped photo processing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verifications:
    post:
      operationId: requestVerification
      summary: Record verification intent; same active request is returned on retry,
        no provider or badge is created
      security:
        - bearerAuth: []
      parameters: []
      responses:
        "201":
          description: Record verification intent; same active request is returned on
            retry, no provider or badge is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationIntake"
  /v1/verifications/{id}:
    get:
      operationId: getVerification
      summary: Read requester-only status; dog membership is also required
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: &a6
            type: string
            format: uuid
      responses:
        "200":
          description: Read requester-only status; dog membership is also required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verifications/{id}/withdraw:
    post:
      operationId: withdrawVerification
      summary: Idempotently withdraw an open request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a6
      responses:
        "200":
          description: Idempotently withdraw an open request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
  /v1/dogs/{dogId}/health-records:
    post:
      operationId: addHealthRecord
      summary: Save a self-reported health record; no identity documents or
        verification fields accepted
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: *a6
      responses:
        "201":
          description: Save a self-reported health record; no identity documents or
            verification fields accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordInput"
    get:
      operationId: listHealthRecords
      summary: List private household health records; expired evidence remains marked
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: *a6
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 400
      responses:
        "200":
          description: List private household health records; expired evidence remains
            marked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthRecord"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - records
                  - nextCursor
        default:
          $ref: "#/components/responses/Problem"
  /v1/dogs/{dogId}/health-records/{id}:
    delete:
      operationId: deleteHealthRecord
      summary: Idempotently remove a record; reviewed evidence removal revokes dog
        health tiers and resets publication
      security:
        - bearerAuth: []
      parameters:
        - name: dogId
          in: path
          required: true
          schema: *a6
        - name: id
          in: path
          required: true
          schema: *a6
      responses:
        "204":
          description: Idempotently remove a record; reviewed evidence removal revokes dog
            health tiers and resets publication
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Structured API error; status/code/detail depend on the failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required:
        - type
        - code
        - title
        - status
        - detail
        - requestId
      properties:
        type:
          type: string
        code:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
    Country:
      type: object
      required:
        - countryCode
        - name
        - rollout
        - callingCode
        - currency
        - distanceUnit
        - defaultLocale
        - supportedLocales
        - defaultTimezone
        - minimumAge
      properties:
        countryCode:
          type: string
        name:
          type: string
        rollout:
          type: string
          enum:
            - development
        callingCode:
          type: string
        currency:
          type: string
        distanceUnit:
          type: string
        defaultLocale:
          type: string
        supportedLocales:
          type: array
          items:
            type: string
        defaultTimezone:
          type: string
        minimumAge:
          type: integer
    RequestOtp:
      type: object
      additionalProperties: false
      required:
        - phoneE164
      properties:
        phoneE164:
          type: string
          pattern: ^\+91[6-9]\d{9}$
        countryCode:
          const: IN
          default: IN
    VerifyOtp:
      type: object
      additionalProperties: false
      required:
        - phoneE164
        - code
        - deviceId
      properties:
        phoneE164:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
        code:
          type: string
          pattern: ^\d{6}$
        deviceId: *a7
        displayName:
          type: string
          minLength: 1
          maxLength: 50
    Refresh:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 80
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - userId
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          const: 900
        userId: *a7
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: []
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        locale:
          enum:
            - en-IN
        timezone:
          type: string
          maxLength: 64
      minProperties: 1
    Me:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - phoneE164Masked
        - locale
        - timezone
        - status
        - countryCode
        - residencyRegion
        - createdAt
      properties:
        id: *a7
        displayName:
          type: string
        phoneE164Masked:
          type: string
        locale:
          type: string
        timezone:
          type: string
        status:
          type: string
        countryCode:
          type: string
        residencyRegion:
          type: string
        createdAt:
          type: string
          format: date-time
    Sessions:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - deviceId
              - createdAt
              - expiresAt
              - current
            properties:
              id: *a7
              deviceId: *a7
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              current:
                type: boolean
    OnboardingPreferences:
      type: object
      additionalProperties: false
      required:
        - countryCode
        - locale
        - mode
        - adultDeclared
      properties:
        countryCode:
          const: IN
        locale:
          const: en-IN
        mode:
          const: pack
        adultDeclared: &a8
          type: boolean
    ConsentInput:
      type: object
      additionalProperties: false
      required:
        - documentId
      properties:
        documentId: &a10
          type: string
          format: uuid
    ActiveDogInput:
      type: object
      additionalProperties: false
      required:
        - dogId
      properties:
        dogId:
          type:
            - string
            - "null"
          format: uuid
    UserPreferences:
      type: object
      additionalProperties: false
      required:
        - discoveryPaused
        - readReceipts
      properties:
        discoveryPaused: *a8
        readReceipts: *a8
    UserPreferencesPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        discoveryPaused: *a8
        readReceipts: *a8
      minProperties: 1
    Onboarding:
      type: object
      additionalProperties: false
      required:
        - rulesVersion
        - ready
        - missing
        - nextAction
        - activeDogId
        - completedAt
        - preferences
      properties:
        rulesVersion:
          const: 1
        ready: *a8
        missing:
          type: array
          items: &a11
            type: string
        nextAction: &a9
          type:
            - string
            - "null"
        activeDogId:
          type:
            - string
            - "null"
          format: uuid
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        preferences:
          $ref: "#/components/schemas/OnboardingPreferences"
    ConsentState:
      type: object
      additionalProperties: false
      required:
        - consents
      properties:
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - purpose
              - required
              - currentDocumentId
              - currentVersion
              - status
              - acceptedDocumentId
              - current
              - recordedAt
            properties:
              purpose:
                enum: *a1
              required: *a8
              currentDocumentId: *a9
              currentVersion: *a9
              status:
                enum:
                  - accepted
                  - withdrawn
                  - not-accepted
              acceptedDocumentId: *a9
              current: *a8
              recordedAt:
                type:
                  - string
                  - "null"
                format: date-time
    LegalDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - version
        - countryCode
        - locale
        - body
        - contentSha256
        - publishedAt
      properties:
        id: *a10
        purpose:
          enum: *a1
        version: *a11
        countryCode: *a11
        locale: *a11
        body: *a11
        contentSha256: *a11
        publishedAt:
          type: string
          format: date-time
    EmptyBody:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    HouseholdInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    Household:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - role
        - createdAt
        - updatedAt
      properties:
        id: *a3
        name: &a13
          type:
            - string
            - "null"
        role:
          enum:
            - owner
            - co_guardian
            - walker
            - view_only
        createdAt: &a12
          type: string
          format: date-time
        updatedAt: *a12
    Households:
      type: object
      additionalProperties: false
      required:
        - households
        - nextCursor
      properties:
        households:
          type: array
          items:
            $ref: "#/components/schemas/Household"
        nextCursor: *a13
    Members:
      type: object
      additionalProperties: false
      required:
        - members
      properties:
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - userId
              - displayName
              - role
              - acceptedAt
            properties:
              userId: *a3
              displayName: &a28
                type: string
              role:
                enum:
                  - owner
                  - co_guardian
                  - walker
                  - view_only
              acceptedAt: *a12
    MemberRole:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          enum:
            - owner
            - co_guardian
            - walker
            - view_only
    InvitationInput:
      type: object
      additionalProperties: false
      required:
        - phoneE164
      properties:
        phoneE164:
          type: string
          pattern: ^\+91[6-9]\d{9}$
        role:
          enum:
            - co_guardian
            - walker
            - view_only
          default: co_guardian
    Invitation:
      type: object
      additionalProperties: false
      required:
        - invitationId
        - inviteToken
        - expiresAt
        - delivery
      properties:
        invitationId: *a3
        inviteToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt: *a12
        delivery:
          const: manual-share
    CreateDog:
      type: object
      additionalProperties: false
      required:
        - householdId
        - name
        - sex
        - sizeClass
      properties:
        name: &a15
          type: string
          minLength: 1
          maxLength: 40
        sex: &a16
          enum:
            - male
            - female
        sizeClass: &a17
          enum:
            - toy
            - small
            - medium
            - large
            - giant
        dateOfBirth: &a14
          type:
            - string
            - "null"
          format: date
        dobPrecision: &a18
          enum:
            - exact
            - month
            - year
            - estimate
        neutered: &a19
          type:
            - boolean
            - "null"
        neuteredAt: *a14
        weightG: &a20
          type:
            - integer
            - "null"
          minimum: 500
          maximum: 120000
        bio: &a21
          type:
            - string
            - "null"
          maxLength: 300
        householdId: *a3
    UpdateDog:
      type: object
      additionalProperties: false
      required: []
      properties:
        name: *a15
        sex: *a16
        sizeClass: *a17
        dateOfBirth: *a14
        dobPrecision: *a18
        neutered: *a19
        neuteredAt: *a14
        weightG: *a20
        bio: *a21
      minProperties: 1
    DogSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - householdId
        - name
        - sex
        - sizeClass
        - dateOfBirth
        - dobPrecision
        - neutered
        - neuteredAt
        - weightG
        - bio
        - status
        - publicationState
        - createdAt
        - updatedAt
      properties:
        id: *a3
        householdId: *a3
        name: *a15
        sex: *a16
        sizeClass: *a17
        dateOfBirth: *a14
        dobPrecision: *a18
        neutered: *a19
        neuteredAt: *a14
        weightG: *a20
        bio: *a21
        status: &a26
          enum:
            - active
            - rehomed
            - memorialised
            - removed
        publicationState: &a27
          enum:
            - draft
            - published
            - paused
        createdAt: *a12
        updatedAt: *a12
    Dogs:
      type: object
      additionalProperties: false
      required:
        - dogs
        - nextCursor
      properties:
        dogs:
          type: array
          items:
            $ref: "#/components/schemas/DogSummary"
        nextCursor: *a13
    DogBreedsInput:
      type: object
      additionalProperties: false
      required:
        - breeds
      properties:
        breeds:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - breedId
              - percentage
            properties:
              breedId: *a3
              percentage:
                type: integer
                minimum: 1
                maximum: 100
          minItems: 1
          maxItems: 4
    Temperament:
      type: object
      additionalProperties: false
      required:
        - questionnaireVersion
        - energy
        - playStyle
        - dogReactivity
        - humanReactivity
        - resourceGuarding
        - recallReliability
        - sizeTolerance
        - needsToKnow
      properties: &a23
        questionnaireVersion:
          const: 1
        energy: &a22
          type: integer
          minimum: 1
          maximum: 5
        playStyle:
          type: array
          items: &a24
            enum:
              - wrestle
              - chase
              - parallel
              - fetch
              - sniff
          minItems: 1
          maxItems: 5
          uniqueItems: true
        dogReactivity: *a22
        humanReactivity: *a22
        resourceGuarding: *a22
        recallReliability: *a22
        sizeTolerance:
          type: array
          items: *a17
          minItems: 1
          maxItems: 5
          uniqueItems: true
        needsToKnow:
          type: string
          maxLength: 500
          default: ""
    TemperamentInput:
      type: object
      additionalProperties: false
      required:
        - questionnaireVersion
        - energy
        - playStyle
        - dogReactivity
        - humanReactivity
        - resourceGuarding
        - recallReliability
        - sizeTolerance
      properties: *a23
    DogPreferences:
      type: object
      additionalProperties: false
      required:
        - maxDistanceBucket
        - sizeClasses
        - ageMinMonths
        - ageMaxMonths
        - energyMin
        - energyMax
        - playStyles
        - minVerificationTier
        - parallelWalkOnly
        - acceptsReactive
      properties: &a25
        maxDistanceBucket:
          enum:
            - under_2_km
            - km_2_5
            - km_5_10
            - km_10_25
            - over_25_km
          default: km_5_10
        sizeClasses:
          type: array
          items: *a17
          maxItems: 5
          uniqueItems: true
          default: []
        ageMinMonths:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 360
          default: null
        ageMaxMonths:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 360
          default: null
        energyMin:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5
          default: null
        energyMax:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5
          default: null
        playStyles:
          type: array
          items: *a24
          maxItems: 5
          uniqueItems: true
          default: []
        minVerificationTier:
          type: integer
          minimum: 0
          maximum: 4
          default: 1
        parallelWalkOnly:
          type: boolean
          default: false
        acceptsReactive:
          type: boolean
          default: false
    DogPreferencesInput:
      type: object
      additionalProperties: false
      required: []
      properties: *a25
    Availability:
      type: object
      additionalProperties: false
      required:
        - timezone
        - windows
      properties:
        timezone:
          type: string
          maxLength: 64
        windows:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - dayOfWeek
              - startMin
              - endMin
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              startMin:
                type: integer
                minimum: 0
                maximum: 1439
              endMin:
                type: integer
                minimum: 1
                maximum: 1440
          maxItems: 21
    BeaconInput:
      type: object
      additionalProperties: false
      required:
        - durationMinutes
      properties:
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 90
    Beacon:
      type: object
      additionalProperties: false
      required:
        - beaconUntil
      properties:
        beaconUntil: *a12
    Dog:
      type: object
      additionalProperties: false
      required:
        - id
        - householdId
        - name
        - sex
