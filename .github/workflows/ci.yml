name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waggle
          POSTGRES_PASSWORD: waggle
          POSTGRES_DB: waggle_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U waggle -d waggle_api_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://waggle:waggle@localhost:5432/waggle_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:openapi
      - run: npm run check:handovers
      - run: npm test
      - run: npm run test:integration
